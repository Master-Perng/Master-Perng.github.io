<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675" role="img" aria-labelledby="title desc">
  <title id="title">Hello cover</title>
  <desc id="desc">An abstract blue and violet cover with the word HELLO.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233f"/>
      <stop offset="0.5" stop-color="#2454a6"/>
      <stop offset="1" stop-color="#8a5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
