  <path d="M-30 535C150 410 300 710 520 515S820 405 930 478" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <text x="450" y="318" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="700" letter-spacing="13">HELLO</text>
  <text x="450" y="390" text-anchor="middle" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="27" letter-spacing="5">MY DIGITAL GARDEN</text>
  <rect x="365" y="440" width="170" height="6" rx="3" fill="#7dd3fc"/>
