baseURL = "https://master-perng.github.io/"
title = "Perng’s Blog"
locale = "zh-CN"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
theme = "Niello"

enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true
summaryLength = 100
mainSections = ["posts"]

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

[markup]
  [markup.goldmark.extensions]
    typographer = true
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false

[params]
  description = "Perng 的个人博客"
  author = "Perng"

  [params.google]
    google_ad_client = ""
    ga4 = ""

  [params.bannershowcase]
    categories = ["随笔"]
    limit = 2

  [params.contact]
    label = "GitHub"
    url = "https://github.com/Master-Perng"

  [params.ignore]
    categories = ["info", "archives"]

  [params.license]
    copyright = "© 2026 Perng. All Rights Reserved."

  [params.share]
    sharethis = ""

  [params.disqus]
    shortname = ""

[[menu.main]]
  name = "首页"
  pageRef = "/"
  weight = 1

[[menu.main]]
  name = "文章"
  pageRef = "/posts"
  weight = 2

[[menu.main]]
  name = "归档"
  pageRef = "/archives"
  weight = 3

[[menu.main]]
  name = "标签"
  pageRef = "/tags"
  weight = 4

[[menu.main]]
  name = "关于"
  pageRef = "/about"
  weight = 5
